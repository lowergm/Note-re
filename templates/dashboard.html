<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta name="description" content="Tá precisando lembrar de algo? Crie notas e veja e reveja sempre que precisar no Note-re">
    <title>Note-re - DashBoard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    
    <script src="https://cdn.jsdelivr.net/npm/motion@11.11.13/dist/motion.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-stone-800 text-white flex items-center justify-center h-screen">
    <table class="border-2">
      <tr class="text-green border-2 border-stone-500 bg-green-900">
        <th>Email</th>
        <th class="border-2 border-stone-500">Senha</th>
      </tr>
      {% for user in usuarios %}
        <tr class="border-2 border-stone-500 text-black bg-sky-100">
          <td>{{ user.email }}</td>
          <td class="border-2 border-stone-500">{{ user.senha }}</td>
        </tr>
      {% endfor %}
    </table>
  </body>
</html>
