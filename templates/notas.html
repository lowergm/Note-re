<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta name="description" content="Tá precisando lembrar de algo? Crie notas e veja e reveja sempre que precisar no Note-re">
    <title>Note-re - Inicio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8">
    
    <!-- Imports -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-stone-900 min-h-screen flex flex-col">
    <header class="border-2 fixed w-full bg-stone-900 shadow-xl rounded-xl">
      <nav class="flex justify-between items-center">
        <i class="bi bi-text-paragraph" style="color: white; font-size: 2rem;">Note-re</i>
        <!-- Logout -->
        <div class="flex justify-end">
          <i class="bi bi-person-circle text-white font-semibold"></i>
          <p class="text-white font-semibold mr-4">{{ current_user.username.capitalize() }}</p>
          <button class="mr-4 border-slate-600 bg-sky-700 rounded-md text-white w-10"><a class="text-white font-semibold" href="{{ url_for('users.logout') }}">Sair</a></button>
        </div>
      </nav>
    </header>
    <main class="pt-20 flex-1">
      <section class="grid p-4">
        {% for nota in current_user.notas %}
          <div class="bg-stone-800 rounded-xl p-4 border-stone-600 border min-h-40 w-full mb-4">
            <h1 class="text-white pb-2 border-b border-stone-600 text-3xl"><strong>{{ nota.titulo }}</strong></h1>
            <h6 class="text-xs text-stone-400">Anotado em: {{ nota.criado_em.strftime('%d/%m/%Y às %H:%M') }}</h6>
            <p class="text-stone-300">{{ nota.texto }}</p>
            <div class="flex justify-end">
              <a href="/excluirnota/{{nota.id}}">
                <i class="text-red-600 bi bi-trash"></i>
              </a>
            </div>
          </div>
        {% endfor %}
      </section>
    </main>
    
    <!-- Modal -->
    <dialog class="bg-stone-900 rounded-xl p-4 border-stone-600 border w-80 shadow-5xl" id="novanota">
      <h1 class="text-white pb-2 border-b border-stone-600 text-3xl"><strong>Nova nota</strong></h1>
      <form method="post" action="{{ url_for('notas.nova_nota') }}">
        <div class="flex flex-col mb-3">
          <label class="text-white">Titulo</label>
          <input name="notatitle" placeholder="Titulo da anotação" class="rounded-md text-white outline-white bg-stone-900 border-2 border-slate-600" required>
        </div>
        <div class="flex flex-col">
          <label class="text-white">Conteúdo</label>
          <textarea name="notacontent" placeholder="Conteúdo da nota" class="rounded-md text-white outline-white bg-stone-900 border-2 border-slate-600 mb-3 h-32" required></textarea>
        </div>
        <span class="flex justify-end">
          <button type="button" class="border-slate-600 bg-red-500 rounded-md text-white w-20 mr-3" onclick="fecharModal()">
            Cancelar
          </button>
          <button type="submit" class="border-slate-600 bg-sky-700 rounded-md text-white w-20">
            <i class="bi bi-pencil">Anotar</i>
          </button>
        </span>
      </form>
    </dialog>
    
    <!-- Footer -->
    <footer class="fixed bottom-4 right-4 flex justify-end">
      <button class="w-16 h-16" id="abrirmodal" onclick="abrirModal()">
        <i class="text-5xl text-sky-700 bi bi-plus-square-fill"></i>
      </button>
    </footer>
    
    <script>
      const plus = document.getElementById("abrirmodal")
      const modal = document.getElementById("novanota")
      
      function abrirModal() {
          modal.showModal()
      }
      
      function fecharModal() {
          modal.close()
      }
    </script>
  </body>
</html>
